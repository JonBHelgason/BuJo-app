<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1c1917" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="108" fill="#1c1917" />
  
  <!-- Dotted Notebook Page -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="url(#paperGrad)" filter="url(#shadow)" />
  
  <!-- Spine Line -->
  <line x1="130" y1="76" x2="130" y2="436" stroke="#e7e5e4" stroke-width="4" stroke-dasharray="8 8" />
  
  <!-- Subtle Dot Grid -->
  <circle cx="180" cy="140" r="3" fill="#a8a29e" />
  <circle cx="240" cy="140" r="3" fill="#a8a29e" />
  <circle cx="300" cy="140" r="3" fill="#a8a29e" />
  <circle cx="360" cy="140" r="3" fill="#a8a29e" />

  <circle cx="180" cy="200" r="3" fill="#a8a29e" />
  <circle cx="240" cy="200" r="3" fill="#a8a29e" />
  <circle cx="300" cy="200" r="3" fill="#a8a29e" />
  <circle cx="360" cy="200" r="3" fill="#a8a29e" />

  <circle cx="180" cy="260" r="3" fill="#a8a29e" />
  <circle cx="240" cy="260" r="3" fill="#a8a29e" />
  <circle cx="300" cy="260" r="3" fill="#a8a29e" />
  <circle cx="360" cy="260" r="3" fill="#a8a29e" />

  <circle cx="180" cy="320" r="3" fill="#a8a29e" />
  <circle cx="240" cy="320" r="3" fill="#a8a29e" />
  <circle cx="300" cy="320" r="3" fill="#a8a29e" />
  <circle cx="360" cy="320" r="3" fill="#a8a29e" />

  <circle cx="180" cy="380" r="3" fill="#a8a29e" />
  <circle cx="240" cy="380" r="3" fill="#a8a29e" />
  <circle cx="300" cy="380" r="3" fill="#a8a29e" />
  <circle cx="360" cy="380" r="3" fill="#a8a29e" />

  <!-- Iconic Bullet Journal Mark in center: Large crisp solid bullet with subtle priority signifier -->
  <circle cx="270" cy="260" r="44" fill="#1c1917" />
  <!-- Small asterisk priority mark -->
  <path d="M 270 180 L 270 204 M 258 186 L 282 198 M 282 186 L 258 198" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
</svg>
